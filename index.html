<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/assets/logo1.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WTPRINTS</title>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
        <div id="root">
      <style>
        body, html { margin: 0; padding: 0; background-color: #fdfdfd; }
        .app-splash-screen {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100vw;
          background-color: #fdfdfd;
          font-family: 'Boldonse', system-ui, sans-serif;
        }
        .app-splash-text {
          color: #ee0652;
          font-size: clamp(32px, 5vw, 48px);
          letter-spacing: 2px;
          font-weight: 1000;
          margin: 0;
          animation: pulse 1.5s infinite ease-in-out;
        }
        .splash-spinner {
          width: 35px;
          height: 35px;
          border: 4px solid #ffe1e8;
          border-top: 4px solid #ee0652;
          border-radius: 50%;
          animation: spin 1s linear infinite;
          margin-top: 25px;
        }
        @keyframes pulse {
          0% { transform: scale(0.98); opacity: 0.7; }
          50% { transform: scale(1.02); opacity: 1; }
          100% { transform: scale(0.98); opacity: 0.7; }
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
      <div class="app-splash-screen">
        <h1 class="app-splash-text">WTPRINTS</h1>
        <div class="splash-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
